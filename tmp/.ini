# 短縮URLサービス要件定義書

## 1. サービス概要

### 1.1 サービス名
URL短縮サービス

### 1.2 目的
長いURLを短縮し、管理・共有を容易にするWebサービスの提供

### 1.3 対象ユーザー
- 一般ユーザー（登録不要での利用で短縮URLでリダイレクトするユーザ）
- 登録ユーザー（短縮URLを登録するユーザ）

## 2. 機能要件

### 2.1 基本機能

#### 2.1.1 URL短縮機能
- **要件**: 長いURLを短い形式のURLに変換する
- **入力**: 有効なURL（http/https）
- **出力**: 短縮URL（例：https://shortlink.com/abc123）
- **制約**: 
  - 元URLの最大長：2048文字
  - 短縮URLの形式：ドメイン + 6-8文字の英数字

#### 2.1.2 リダイレクト機能
- **要件**: 短縮URLにアクセスした際、元URLにリダイレクトする
- **レスポンス**: HTTP 301 リダイレクト
- **パフォーマンス**: 99.9%のリクエストを100ms以内で処理

### 2.2 管理機能

#### 2.2.1 URL管理（yaokoの閉塞網なら誰でもアクセス可能）
- **要件**: 作成した短縮URLの一覧表示
- **機能**:
  - URL一覧表示
  - URL削除

## 3. 非機能要件

### 3.1 パフォーマンス要件
- **レスポンス時間**: 
  - URL短縮：500ms以内
  - リダイレクト：100ms以内
- **スループット**: 10,000 req/sec
- **同時接続数**: 1,000ユーザー

### 3.2 システム制約

#### 3.2.1 技術制約
- **プログラミング言語&Framework**: TypeScript, Sveltekit
- **データベース**: RDS
- **クラウド**: EC2インスタンス（t3.micro）

Renderだと楽で安い...

#### 3.2.2 運用制約
- **データ保存期間**: 無期限
- **バックアップ**: 日次バックアップの実施
- **ログ保存**: アクセスログ1年間保存

## 4. 画面要件

### 4.1 トップページ
- 新規URL作成フォーム
- 短縮URL生成結果表示

### 4.2 ダッシュボード（登録ユーザー）
- 作成したURL一覧

## 5. 今後の拡張計画

### 5.1 Phase 2機能
- QRコード生成機能
- 登録ユーザ認証機能
- 作成したURL検索機能
- アクセスログの拡充
